plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation' // No Jakarta Bean Validation provider could be found 에러나서 추가함
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.0.4'

	// security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	testImplementation 'org.springframework.security:spring-security-test'

	// DB
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'  // JDBC API
	implementation 'org.mariadb.jdbc:mariadb-java-client:3.1.4' // MariaDB JDBC 드라이버
	implementation 'org.flywaydb:flyway-core' // DB 스키마 변경(인덱스 포함)을 버전 관리
	implementation 'org.flywaydb:flyway-mysql'

	// JPA
	implementation("org.springframework.boot:spring-boot-starter-data-jpa")
	testImplementation("org.springframework.boot:spring-boot-starter-test")

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// 외부 API 인터페이스
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// AWS:S3
	implementation 'org.jsoup:jsoup:1.17.2' // HTML 문서에서 og:title, og:image 등 OG 메타 태그를 파싱하기 위한 라이브러리
	implementation platform('software.amazon.awssdk:bom:2.25.0') // AWS SDK v2
	implementation 'software.amazon.awssdk:s3' // S3 객체 업로드/다운로드를 위한 클라이언트

	// OG 메타데이터 분석 & 파싱 구현
	implementation 'org.jsoup:jsoup:1.17.2' // OG
	implementation 'net.coobird:thumbnailator:0.4.20' // 썸네일

}

tasks.named('test') {
	useJUnitPlatform()
}

// 배포를 위한 추가
jar {
	enabled = false
}